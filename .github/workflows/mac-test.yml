# macOS test: the release's CicaTavern.app built, tested and opened on GitHub's
# Macs, with screenshots. Only for the mac-test branch (a push) or by hand; it
# never makes or changes a Release, a tag or a draft, and needs only read access.
#
# Intel only (macOS 15): the Apple silicon packages are built and tested on the
# author's own Mac (scripts/mac-local-build.mjs, from this same branch). On the runner:
#   1. npm ci, npm test with the official Node for the runner's processor;
#   2. CicaTavern.app for that processor, built, signed and zipped exactly as
#      mac-release.yml does (scripts/mac-build.sh), and the zip's own Node
#      smoke-tested. With the Developer ID in the mac-signing environment's secrets
#      (MAC_CERT_P12: the .p12 in base64, MAC_CERT_PASSWORD, and the notary key:
#      NOTARY_KEY_P8, the .p8 as it is, NOTARY_KEY_ID, NOTARY_ISSUER_ID) the app
#      and the disk image are signed with it and notarized, in a keychain of the
#      run's own that is deleted afterwards; without them (a fork), ad hoc;
#   3. scripts/mac-gui-test.sh opens the app from ~/Applications: the window, the
#      bundled server's /api/status, the page connected to it, screenshots (first
#      start, the empty main window, the example card in English and in Chinese), a
#      recording, the app quitting and the server then quitting by itself.
# The screenshots, recording, logs and zips are this run's artifacts (kept 14
# days); the run's summary links them.
name: macOS test (screenshots)

on:
  push:
    branches: [mac-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: v24.22.0
  # Node 24's own minimum (its BUILDING.md); launcher/mac/Info.plist says the same.
  MACOS_MIN: '13.5'

jobs:
  mac:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The signing secrets live in this environment, which only mac-test may use and
    # whose runs wait for the maintainer's approval: until then no step sees them.
    environment: mac-signing
    env:
      SIGNING: ${{ secrets.MAC_CERT_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            label: macOS 15, Intel
            slug: macos15-x64
            keep-zip: true
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Official Node.js, checked against nodejs.org's SHASUMS256
        run: |
          bash scripts/mac-build.sh node "$RUNNER_TEMP/node" "${{ matrix.arch }}"
          echo "$RUNNER_TEMP/node/node-${NODE_VERSION}-darwin-${{ matrix.arch }}/bin" >> "$GITHUB_PATH"

      - name: npm test
        run: |
          node --version
          node -p "process.platform + ' ' + process.arch"
          npm ci
          npm test

      - name: dmgbuild, for the disk image (pinned by hash)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --disable-pip-version-check --require-hashes -r scripts/dmg-requirements.txt
          echo "DMG_PYTHON=$RUNNER_TEMP/dmgbuild/bin/python" >> "$GITHUB_ENV"

      - name: Developer ID keychain and notary key
        if: env.SIGNING == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          sign="$RUNNER_TEMP/sign"
          mkdir -m 700 "$sign"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$sign/cert.p12"
          printf '%s\n' "$NOTARY_KEY_P8" > "$sign/notary.p8"
          identity=$(bash scripts/mac-build.sh keychain "$sign/cert.p12" "$sign/signing.keychain-db")
          rm "$sign/cert.p12"
          echo "signing as $identity"
          {
            echo "MAC_SIGN_IDENTITY=$identity"
            echo "MAC_KEYCHAIN=$sign/signing.keychain-db"
            echo "NOTARY_KEY=$sign/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build CicaTavern.app, sign, zip
        run: bash scripts/mac-build.sh app "${{ matrix.arch }}" "$RUNNER_TEMP/node" "$RUNNER_TEMP/build" "$RUNNER_TEMP/dist"

      - name: Disk image (drag CicaTavern into Applications)
        run: bash scripts/mac-build.sh dmg "$RUNNER_TEMP/build/CicaTavern.app" "$RUNNER_TEMP/dist" "${{ matrix.arch }}"

      - name: Delete the keychain and the notary key
        if: always() && env.SIGNING == 'true'
        run: |
          [ -z "${MAC_KEYCHAIN:-}" ] || bash scripts/mac-build.sh keychain-remove "$MAC_KEYCHAIN" || true
          rm -rf "$RUNNER_TEMP/sign"

      - name: Smoke test the packaged Node
        run: bash scripts/mac-build.sh smoke "$RUNNER_TEMP/dist/CicaTavern-${VERSION}-mac-${{ matrix.arch }}.zip" 8799 "$RUNNER_TEMP/smoke-data"

      - name: Open the app and take screenshots
        run: bash scripts/mac-gui-test.sh "$RUNNER_TEMP/dist/CicaTavern-${VERSION}-mac-${{ matrix.arch }}.zip" "$RUNNER_TEMP/shots"

      - name: Open the disk image as a download is opened, and take a screenshot of its window
        # GitHub's Macs draw the window without its background picture; a real Mac shows it
        # (checked on macOS 27): the screenshot is for the layout and the icons.
        if: always()
        run: |
          dmg="$RUNNER_TEMP/dist/CicaTavern-${VERSION}-mac-${{ matrix.arch }}.dmg"
          [ -f "$dmg" ] || exit 0
          mkdir -p "$RUNNER_TEMP/shots"
          open "$dmg"
          for _ in $(seq 1 20); do [ -d "/Volumes/CicaTavern ${VERSION}" ] && break; sleep 1; done
          sleep 5
          screencapture -x "$RUNNER_TEMP/shots/5-dmg-window.png" || true
          hdiutil detach "/Volumes/CicaTavern ${VERSION}" -force -quiet || true

      - name: Main screenshot under its own name
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/shots/4-card-chinese.png" ]; then
            cp "$RUNNER_TEMP/shots/4-card-chinese.png" "$RUNNER_TEMP/CicaTavern-${{ matrix.slug }}.png"
          fi

      - name: Keep the screenshots, recording and logs
        if: always()
        id: shots
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-${{ matrix.slug }}
          path: ${{ runner.temp }}/shots
          retention-days: 14
          if-no-files-found: warn

      - name: Keep the main screenshot
        if: always()
        id: main
        uses: actions/upload-artifact@v7
        with:
          name: CicaTavern-${{ matrix.slug }}.png
          path: ${{ runner.temp }}/CicaTavern-${{ matrix.slug }}.png
          archive: false
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the zip (to try on a real Mac)
        if: matrix.keep-zip
        id: zip
        uses: actions/upload-artifact@v7
        with:
          name: CicaTavern-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip
          path: ${{ runner.temp }}/dist/CicaTavern-${{ env.VERSION }}-mac-${{ matrix.arch }}.zip
          archive: false
          retention-days: 14

      - name: Keep the disk image (to try on a real Mac)
        if: matrix.keep-zip
        id: dmg
        uses: actions/upload-artifact@v7
        with:
          name: CicaTavern-${{ env.VERSION }}-mac-${{ matrix.arch }}.dmg
          path: ${{ runner.temp }}/dist/CicaTavern-${{ env.VERSION }}-mac-${{ matrix.arch }}.dmg
          archive: false
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          steps="$RUNNER_TEMP/shots/steps.log"
          {
            echo "### ${{ matrix.label }} (${{ matrix.runner }})"
            echo ""
            if grep -q "all checks passed" "$steps" 2> /dev/null; then echo "**All checks passed.**"; else echo "**Not all checks passed: see the job's log.**"; fi
            echo ""
            if [ "$SIGNING" = true ]; then echo "- Signed with ${MAC_SIGN_IDENTITY:-the Developer ID} and notarized"; else echo "- Signed ad hoc, not notarized (no Developer ID in the mac-signing environment)"; fi
            [ -f "$RUNNER_TEMP/shots/system.txt" ] && sed 's/^/    /' "$RUNNER_TEMP/shots/system.txt" && echo ""
            grep -E "^(window|/api/status|server process|runtime/node|screenshot|quit:|the server quit|Gatekeeper|.*: rejected|.*accepted)" "$steps" 2> /dev/null | sed 's/^/- /' || true
            echo ""
            echo "- [Main window screenshot](${{ steps.main.outputs.artifact-url }})"
            echo "- [All screenshots, the recording and the logs](${{ steps.shots.outputs.artifact-url }})"
            if [ -n "${{ steps.dmg.outputs.artifact-url }}" ]; then echo "- [The disk image, to try on a real Mac](${{ steps.dmg.outputs.artifact-url }})"; fi
            if [ -n "${{ steps.zip.outputs.artifact-url }}" ]; then echo "- [The zip, to try on a real Mac](${{ steps.zip.outputs.artifact-url }})"; fi
          } >> "$GITHUB_STEP_SUMMARY"
